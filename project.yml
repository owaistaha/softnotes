name: SoftNotes
options:
  bundleIdPrefix: com.owaistaha
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SoftNotes:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: DesignSystem
      - path: Models
      - path: Features
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owaistaha.softnotes
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        ENABLE_PREVIEWS: YES
  SoftNotesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SoftNotesUITests
    dependencies:
      - target: SoftNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owaistaha.softnotes.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SoftNotes
  SoftNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SoftNotesTests
    dependencies:
      - target: SoftNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owaistaha.softnotes.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SoftNotes.app/SoftNotes"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SoftNotes:
    build:
      targets:
        SoftNotes: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SoftNotesTests
        - SoftNotesUITests
